# Synapse AgentGateway usage-conformance gate — ENFORCED variant.
#
# Every candidate that can become a production agentgateway image MUST pass
# this workflow. The infra repo (namirialgroup/synapse-infra) runs the same
# gate on any PR that touches infrastructure/prod/agentgateway/**, and every
# synapse/* release branch carries this check — a failing candidate cannot be
# merged, built into a release branch, or promoted.
#
# Invariant (docs/synapse-usage-conformance.md):
#   AgentGateway upgrade candidate -> usage conformance -> PASS -> eligible
#   No upgrade may silently regress to: missing usage -> explicit 0 -> fake $0.
#
# Since the v1.6.0 rebase the gate lives on the same branch as the candidate
# (scripts/synapse-usage-conformance-gate.sh grafts its golden modules onto a
# temporary candidate worktree), so the workflow gates the pushed ref itself.
name: synapse-usage-conformance

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: "AgentGateway candidate ref (branch/tag/sha) to gate"
        required: false
        default: ""
  push:
    branches:
      - "synapse/**"
  pull_request:
    branches:
      - "synapse/**"

permissions:
  contents: read

jobs:
  conformance:
    name: usage-conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate (gate included)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.candidate_ref || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: usage-conformance-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            usage-conformance-${{ runner.os }}-

      - name: Run Synapse usage-conformance gate
        id: gate
        run: |
          set -euo pipefail
          export AGW_GATE_TARGET_DIR="$GITHUB_WORKSPACE/target"
          ./scripts/synapse-usage-conformance-gate.sh .

      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usage-conformance-logs
          path: |
            /tmp/agw-gate-tier1.log
            /tmp/agw-gate-tier2.log
          if-no-files-found: ignore
